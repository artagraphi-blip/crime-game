<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>دژ سیمرغ</title>
<script src="https://developer.eitaa.com/eitaa-web-app.js"></script>
<style>
:root{--gold:#ffcf5a;--gold2:#ff9d2e;--teal:#43d9c8;--pink:#ff6fa8;--vio:#8f5bff;--bg:#0d0820;--card:rgba(32,20,66,.9);--bd:rgba(255,255,255,.14);--tx:#f6f1ff;--mut:#b2a6d4;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font-family:Tahoma,"Segoe UI",system-ui,sans-serif;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .15s,filter .2s}
button:active:not(:disabled){transform:scale(.93)}
button:disabled{opacity:.45}
#app{position:fixed;inset:0}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#top{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:7px;align-items:center;z-index:5;pointer-events:none}
#top>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:8px;background:linear-gradient(180deg,rgba(60,38,110,.92),rgba(30,18,64,.92));border:1px solid var(--bd);border-radius:99px;padding:5px 12px 5px 8px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.18)}
.coin{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2b0,var(--gold) 45%,var(--gold2));box-shadow:0 0 10px rgba(255,200,80,.7),inset 0 -2px 3px rgba(150,70,0,.6);display:inline-block;position:relative;flex:none}
.coin::after{content:"";position:absolute;inset:6px;border-radius:50%;border:2px solid rgba(160,80,0,.55)}
#cp.bump{animation:bump .3s}
@keyframes bump{50%{transform:scale(1.14)}}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:19px;background:linear-gradient(180deg,rgba(60,38,110,.92),rgba(30,18,64,.92));border:1px solid var(--bd);box-shadow:0 6px 16px rgba(0,0,0,.4);position:relative}
.ib.rdy{animation:glow 1.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(255,207,90,.6),0 6px 16px rgba(0,0,0,.4)}50%{box-shadow:0 0 0 9px rgba(255,207,90,0),0 6px 16px rgba(0,0,0,.4)}}
.sp{flex:1}
#nav{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:2px;padding:6px;border-radius:24px;background:linear-gradient(180deg,rgba(48,30,92,.95),rgba(22,12,48,.97));border:1px solid var(--bd);box-shadow:0 -4px 24px rgba(0,0,0,.45);z-index:6}
.nb{flex:1;border-radius:18px;padding:6px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);position:relative}
.nb i{font-style:normal;font-size:21px;line-height:1.2;transition:transform .3s}
.nb.on{color:#1d1030;background:linear-gradient(180deg,#ffe28a,var(--gold2));box-shadow:0 6px 16px rgba(255,170,40,.45),inset 0 1px 0 rgba(255,255,255,.6);font-weight:700}
.nb.on i{transform:translateY(-2px) scale(1.12)}
.page{position:absolute;left:0;right:0;top:0;bottom:0;padding:calc(64px + env(safe-area-inset-top,0px)) 12px calc(84px + env(safe-area-inset-bottom,0px));overflow-y:auto;background:radial-gradient(120% 60% at 50% 0%,#3a1c6e,#150c2e 70%);z-index:3;display:none;animation:fu .35s ease both}
.page.on{display:block}
@keyframes fu{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
h2{margin:6px 0 10px;font-size:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:0 8px 22px rgba(0,0,0,.3)}
.card h3{margin:0 0 4px;font-size:16px}
.card p{margin:4px 0;color:var(--mut);font-size:14px;line-height:1.9}
.btn{display:block;width:100%;border-radius:16px;padding:10px 14px;font-weight:700;color:#2a1500;background:linear-gradient(180deg,#ffe28a,var(--gold2));box-shadow:0 6px 16px rgba(255,160,40,.35),inset 0 1px 0 rgba(255,255,255,.6);position:relative;overflow:hidden;text-align:center}
.btn::after{content:"";position:absolute;top:0;bottom:0;width:36%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);animation:shine 4.5s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.btn.g{color:var(--tx);background:linear-gradient(180deg,#5a3aa8,#3a2275);box-shadow:0 6px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.2)}
.btn.g::after{display:none}
.row{display:flex;gap:8px;align-items:center}
.chap{margin:14px 2px 8px;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--gold)}
.chap::after{content:"";flex:1;height:2px;background:linear-gradient(90deg,var(--gold2),transparent)}
.stg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sn{aspect-ratio:1;border-radius:16px;background:linear-gradient(180deg,#5a3aa8,#2e1a63);border:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:18px;position:relative;box-shadow:0 6px 14px rgba(0,0,0,.35);animation:fu .4s ease both}
.sn small{font-size:9px;letter-spacing:1px;color:var(--gold);height:12px}
.sn.cur{background:linear-gradient(180deg,#ffe28a,var(--gold2));color:#2a1500;animation:glow 1.4s ease-in-out infinite}
.sn.cur small{color:#7a3d00}
.sn.lk{opacity:.4;filter:grayscale(.6)}
.sn.bs{background:linear-gradient(180deg,#a02a4e,#4a0f2a);border-color:#ff7a8a}
.sn.bs.cur{background:linear-gradient(180deg,#ff9a7a,#d63a4a)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hcard{position:relative;border-radius:22px;padding:8px 8px 10px;color:#fff;overflow:hidden;background:var(--bgc);border:2px solid var(--c);box-shadow:0 0 22px -4px var(--c),0 14px 26px rgba(0,0,0,.5);transition:transform .12s;will-change:transform;animation:fu .45s ease both}
.hcard::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.08) 0 12px,transparent 12px 28px);pointer-events:none}
.hcard::after{content:"";position:absolute;top:-20%;bottom:-20%;width:40%;left:-70%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);transform:skewX(-18deg);animation:foil 4.2s ease-in-out infinite;pointer-events:none}
@keyframes foil{0%,55%{left:-70%}100%{left:150%}}
.r1{--c:#3aa0ff;--bgc:linear-gradient(165deg,#2056c4,#0a1f55)}
.r2{--c:#c26bff;--bgc:linear-gradient(165deg,#7a2bd0,#2c0f5c)}
.r3{--c:#ff9d2e;--bgc:linear-gradient(165deg,#d65a1c,#5a1a08)}
.r4{--c:#ffd24a;--bgc:linear-gradient(165deg,#ff9d2e,#a02a6a 55%,#3a2a9a)}
.hcard .rar{position:relative;z-index:1;font-size:11px;font-weight:800;color:var(--c);text-shadow:0 0 8px var(--c);margin:0 2px}
.hcard .pt{position:relative;z-index:1;height:118px;display:grid;place-items:center;margin-top:2px;background:radial-gradient(circle at 50% 78%,color-mix(in srgb,var(--c) 70%,transparent),transparent 70%)}
.hcard canvas{width:100px;height:100px}
.hcard .nmr{position:relative;z-index:1;margin:2px -18px 0;padding:3px 20px;transform:skewX(-8deg);background:rgba(8,3,22,.72);font-weight:800;font-size:14px;text-align:center;border-top:2px solid var(--c);border-bottom:2px solid var(--c)}
.hcard .nmr span{display:inline-block;transform:skewX(8deg)}
.hcard .stt{position:relative;z-index:1;display:flex;justify-content:space-around;font-size:12px;margin:7px 0 3px}
.hcard .dsc{position:relative;z-index:1;font-size:11px;color:rgba(255,255,255,.78);line-height:1.7;min-height:38px;margin:2px 2px 6px}
.hcard .pips{position:relative;z-index:1;display:flex;gap:3px;justify-content:center;margin-bottom:6px}
.hcard .pips i{width:9px;height:9px;transform:rotate(45deg);background:rgba(255,255,255,.22)}
.hcard .pips i.on{background:var(--c);box-shadow:0 0 6px var(--c)}
.hcard .btn{position:relative;z-index:1;padding:7px 6px;font-size:13px;border-radius:12px}
.hcard.lkd{filter:grayscale(.85) brightness(.75)}
.hcard .lkt{position:relative;z-index:1;text-align:center;font-size:12px;background:rgba(0,0,0,.5);border-radius:10px;padding:5px}
.pk{display:flex;gap:10px;align-items:center}
.pk .ic{font-size:34px;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:radial-gradient(circle,#5a3aa8,#241250);flex:none;animation:fl 3.4s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-3px)}}
.tag{display:inline-block;border-radius:99px;padding:0 10px;font-size:12px;background:rgba(255,207,90,.18);color:var(--gold)}
#sheet{position:absolute;left:8px;right:8px;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:7;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:12px;box-shadow:0 -10px 34px rgba(0,0,0,.55);transform:translateY(130%);visibility:hidden;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s .35s;max-height:58vh;overflow-y:auto}
#sheet.on{transform:none;visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1.1),visibility 0s}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:right;background:rgba(255,255,255,.07);border:1px solid var(--bd);border-radius:16px;padding:8px 10px;margin-top:8px}
.opt b{display:block;font-size:15px}.opt small{color:var(--mut);display:block;line-height:1.6}
.opt .pr{margin-inline-start:auto;font-weight:700;color:var(--gold);white-space:nowrap}
.opt .em{font-size:28px;width:44px;text-align:center}
#hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top,0px));z-index:4;max-width:90%;padding:6px 14px;border-radius:99px;background:rgba(20,10,44,.8);border:1px solid var(--bd);font-size:13px;text-align:center;pointer-events:none}
#bh{position:absolute;inset:0;z-index:5;pointer-events:none;display:none}
#bh>*{pointer-events:auto}
#bt{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;gap:7px;align-items:center}
.cb{flex:1;padding:6px 18px;background:linear-gradient(180deg,rgba(22,12,44,.92),rgba(10,5,26,.92));clip-path:polygon(0 0,100% 0,97% 100%,3% 100%);border-top:2px solid var(--gold2)}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),#8fffe0);transition:width .2s}
.bar.hp i{background:linear-gradient(90deg,#ff6a5a,#ffb25a)}
.bar.en i{background:linear-gradient(90deg,var(--gold2),#fff0a0)}
#bdk{position:absolute;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:24px;background:linear-gradient(180deg,rgba(48,30,92,.95),rgba(22,12,48,.97));border:1px solid var(--bd);box-shadow:0 -4px 24px rgba(0,0,0,.45)}
#hs{display:flex;gap:8px;margin-top:6px}
.hb{flex:1;border-radius:14px;background:var(--bgc);border:2px solid var(--c);padding:3px 2px 2px;display:flex;flex-direction:column;align-items:center;position:relative;overflow:hidden;box-shadow:0 0 10px -2px var(--c)}
.hb canvas{width:52px;height:52px}
.hb.sel{outline:3px solid #fff;box-shadow:0 0 18px var(--c);transform:translateY(-4px)}
.hb small{font-size:12px;font-weight:700;color:#fff}
.hb .gem{position:absolute;top:2px;left:3px;min-width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff2b0,var(--gold2));color:#4a2000;font-size:12px;font-weight:800;display:grid;place-items:center}
.hb .cdm{position:absolute;left:0;right:0;bottom:0;background:rgba(10,4,24,.74);height:0}
#wb{position:absolute;left:0;right:0;top:32%;text-align:center;font-size:34px;font-weight:900;color:var(--gold);text-shadow:0 0 18px #ff9d2e,0 4px 0 #6a2d00;pointer-events:none;opacity:0;z-index:8}
#wb.on{animation:wv 2.2s ease both}
@keyframes wv{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.2)}}
#ks{position:absolute;left:0;right:0;top:calc(110px + env(safe-area-inset-top,0px));text-align:center;font-size:26px;font-weight:900;color:#fff;pointer-events:none;opacity:0;z-index:8;text-shadow:0 0 14px #ff3a4a,0 3px 0 #5a0a14}
#ks.on{animation:ksa 1.5s ease both}
@keyframes ksa{0%{opacity:0;transform:translateX(60px) skewX(-12deg)}15%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateX(-40px)}}
#dmg{position:absolute;inset:0;pointer-events:none;z-index:4;opacity:0;box-shadow:inset 0 0 120px 20px rgba(255,40,60,.65)}
#dmg.on{animation:dm .5s ease}
@keyframes dm{0%{opacity:.9}100%{opacity:0}}
.ov{position:absolute;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(6,2,16,.82)}
.ov.on{display:flex}
.md{width:100%;max-width:380px;text-align:center;background:linear-gradient(180deg,#4a2a96,#22123f);border:1px solid var(--bd);border-radius:28px;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pp .5s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes pp{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.md h1{margin:4px 0 6px;font-size:28px;color:var(--gold);text-shadow:0 0 18px rgba(255,160,40,.7)}
.md p{color:var(--mut);line-height:1.9;margin:6px 0}
.stars{font-size:38px;letter-spacing:4px}
.stars b{display:inline-block;animation:pp .5s cubic-bezier(.2,.9,.3,1.5) both}
#title{background:radial-gradient(120% 70% at 50% 20%,rgba(120,60,200,.55),rgba(8,3,20,.96))}
#title h1{font-size:44px}
.sl{width:100%;margin:6px 0 14px;accent-color:var(--gold2);height:30px}
.sl-l{display:flex;justify-content:space-between;font-weight:700;margin-top:6px}
.lb{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;margin-bottom:10px;text-decoration:none;color:inherit;background:linear-gradient(135deg,rgba(255,111,168,.25),rgba(143,91,255,.35));border:1px solid var(--bd)}
.lb .lbi{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,var(--pink),var(--vio));box-shadow:0 8px 18px rgba(143,91,255,.5)}
.lb b{display:block}.lb small{display:block;color:var(--mut);direction:ltr;text-align:right}
.lb.v2{background:linear-gradient(135deg,rgba(143,91,255,.35),rgba(255,111,168,.25))}
#toast{position:absolute;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:rgba(20,10,44,.92);border:1px solid var(--bd);border-radius:99px;padding:7px 16px;font-size:13px;opacity:0;transition:.3s;z-index:30;pointer-events:none;white-space:nowrap;max-width:92%}
#toast.on{opacity:1;transform:translateX(-50%)}
ul.gd{margin:4px 0;padding-right:20px;color:var(--mut);font-size:14px;line-height:2}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>
  <div id="dmg"></div>
  <div id="top">
    <div class="pill" id="cp"><span class="coin"></span><span id="cn">۰</span></div>
    <button class="ib" id="gift" aria-label="هدیه">🎁</button>
    <button class="ib" id="all" aria-label="جمع‌آوری همه">🧺</button>
    <button class="ib" id="land" aria-label="قلمرو">🗺️</button>
    <div class="sp"></div>
    <button class="ib" id="snd" aria-label="صدا">🎵</button>
  </div>
  <div id="hint"></div>

  <div id="bh">
    <div id="bt">
      <button class="ib" id="bx" aria-label="خروج">✕</button>
      <div class="cb">
        <div class="row" style="justify-content:space-between;font-size:12px"><span id="bw">موج ۱</span><span id="bs">مرحله ۱</span></div>
        <div class="bar hp"><i id="chp" style="width:100%"></i></div>
      </div>
      <button class="ib" id="spd" aria-label="سرعت">×۱</button>
      <button class="ib" id="bsnd" aria-label="صدا">🎵</button>
    </div>
    <div id="bdk">
      <div class="row" style="font-size:12px"><span>✨ نور</span><div class="bar en" style="flex:1"><i id="en" style="width:50%"></i></div><span id="enn">۵</span></div>
      <div id="hs"></div>
    </div>
  </div>
  <div id="wb"></div>
  <div id="ks"></div>

  <div id="sheet"></div>

  <section class="page" id="pg-battle"></section>
  <section class="page" id="pg-heroes"></section>
  <section class="page" id="pg-shop"></section>
  <section class="page" id="pg-guide"></section>
  <section class="page" id="pg-maker"></section>

  <nav id="nav">
    <button class="nb on" data-p="city"><i>🏰</i>شهر</button>
    <button class="nb" data-p="battle"><i>⚔️</i>نبرد</button>
    <button class="nb" data-p="heroes"><i>🛡️</i>قهرمانان</button>
    <button class="nb" data-p="shop"><i>💎</i>فروشگاه</button>
    <button class="nb" data-p="guide"><i>📜</i>راهنما</button>
    <button class="nb" data-p="maker"><i>✨</i>سازنده</button>
  </nav>

  <div class="ov on" id="title"><div class="md">
    <div style="font-size:64px;animation:fl 3s ease-in-out infinite">🦅</div>
    <h1>دژ سیمرغ</h1>
    <p>دیوها از کوه‌های تاریک سرازیر شده‌اند. شهرت را بساز، سکه جمع کن، پهلوانان شاهنامه را فرا بخوان و دژ سیمرغ را نگه دار.</p>
    <p style="font-size:12px">🎧 با هدفون بهتر است</p>
    <button class="btn" id="go" style="margin-top:10px;font-size:18px">ورود به دژ</button>
  </div></div>
  <div class="ov" id="set"><div class="md">
    <h1 style="font-size:24px">🎚️ تنظیمات صدا</h1>
    <div class="sl-l"><span>🎵 موسیقی</span><span id="vmv"></span></div>
    <input class="sl" type="range" id="vm" min="0" max="100">
    <div class="sl-l"><span>🔊 جلوه‌های صوتی</span><span id="vsv"></span></div>
    <input class="sl" type="range" id="vs" min="0" max="100">
    <div class="row"><button class="btn g" id="mu">قطع صدا</button><button class="btn" id="setx">بستن</button></div>
  </div></div>
  <div class="ov" id="res"></div>
  <div id="toast"></div>
</div>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const fa=s=>String(s).replace(/\d/g,d=>"۰۱۲۳۴۵۶۷۸۹"[d]);
const fn=n=>fa(String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,"٬"));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
let W0=null;try{W0=window.Eitaa&&window.Eitaa.WebApp;if(W0){W0.ready&&W0.ready();W0.expand&&W0.expand()}}catch(e){}

/* ================= ذخیره ================= */
const KEY="dezh_v2";
const defSave=()=>({coins:200,cit:1,land:1,b:[{id:1,t:"bow",x:2,y:5,l:1,t0:Date.now()},{id:2,t:"mine",x:6,y:4,l:1,t0:Date.now()},{id:3,t:"garden",x:1,y:2,l:1,t0:Date.now()}],nid:4,h:{arash:1,rostam:0,gord:0,simorgh:0},stage:1,stars:{},daily:0,vm:.6,vs:.85,mute:0,wins:0});
let S;try{S=Object.assign(defSave(),JSON.parse(localStorage.getItem(KEY)||"null")||{})}catch(e){S=defSave()}
S.h=Object.assign({arash:1,rostam:0,gord:0,simorgh:0},S.h);S.land=S.land||1;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

/* ================= تعریف‌ها ================= */

}

  c.setTransform(DPR,0,0,DPR,0,0);
  c.globalCompositeOperation="lighter";
  embers.forEach(e=>{const x=((e.x*VW+Math.sin(T*.7+e.p)*14)%VW+VW)%VW,y=((e.y*VH-T*8*e.s)%VH+VH)%VH,a=.25+.25*Math.sin(T*2+e.p),g=c.createRadialGradient(x,y,0,x,y,e.s*5);g.addColorStop(0,"hsla("+e.h+",100%,70%,"+a+")");g.addColorStop(1,"hsla("+e.h+",100%,70%,0)");c.fillStyle=g;c.fillRect(x-e.s*5,y-e.s*5,e.s*10,e.s*10)});
  c.globalCompositeOperation="source-over";
  floaters.forEach(f=>{if(f.sx==null)return;const a=1-f.t/1.1;c.globalAlpha=Math.max(0,a);c.font="bold 16px Tahoma";c.textAlign="center";c.lineWidth=3;c.strokeStyle="rgba(20,8,40,.9)";c.strokeText(f.txt,f.sx,f.sy-f.t*40);c.fillStyle=f.col;c.fillText(f.txt,f.sx,f.sy-f.t*40)});c.globalAlpha=1;
  fcoins.forEach(f=>{if(f.t<0||f.tx==null)return;const k=f.t/.8,e=k*k,x=f.sx+(f.tx-f.sx)*e+f.rx*Math.sin(k*3.14),y=f.sy+(f.ty-f.sy)*e+f.ry*Math.sin(k*3.14);c.fillStyle="#ffcf5a";c.strokeStyle="#b36b00";c.lineWidth=2;c.beginPath();c.arc(x,y,7,0,7);c.fill();c.stroke()});
  const vg=c.createRadialGradient(VW/2,VH/2,VH*.3,VW/2,VH/2,VH*.8);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(6,2,16,.55)");c.fillStyle=vg;c.fillRect(0,0,VW,VH);
}

/* ================= به‌روزرسانی ================= */
function update(dt){
  disp+=(S.coins-disp)*Math.min(1,dt*8);if(Math.abs(S.coins-disp)<1)disp=S.coins;$("cn").textContent=fn(disp);
  if(shake>0)shake=Math.max(0,shake-dt*30);if(landT>0)landT-=dt;
  S.b.forEach(b=>{if(b.pop>0)b.pop=Math.max(0,b.pop-dt*2.2)});
  fx.forEach(p=>{p.t+=dt;if(p.vx!=null){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*dt}});fx=fx.filter(p=>p.t<p.life);
  floaters.forEach(f=>f.t+=dt);floaters=floaters.filter(f=>f.t<1.1);
  const pr=$("cp").getBoundingClientRect(),tx=pr.left+26,ty=pr.top+pr.height/2;
  fcoins.forEach(f=>{f.t+=dt;f.tx=tx;f.ty=ty;if(f.t>=.8&&!f.done){f.done=1;$("cp").classList.remove("bump");void $("cp").offsetWidth;$("cp").classList.add("bump")}});fcoins=fcoins.filter(f=>f.t<.8);
  if(mode==="battle"&&B){if(!B.over)simStep(dt*B.speed);updDeck()}
  const rdy=Date.now()-S.daily>20*3600*1000;$("gift").classList.toggle("rdy",rdy);
  $("all").classList.toggle("rdy",S.b.some(b=>BD[b.t].rate&&acc(b)>=Math.max(5,capOf(b)*.15)));
  hintUpd();
}

  const h=$("hint");if(page!=="city"||mode!=="city"){h.style.display="none";return}h.style.display="";
  let t="";if(S.b.length<=3)t="روی زمین خالی بزن و ساختمان بساز 👆";else if(S.b.some(b=>b.ruin))t="💥 ساختمان ویرانه‌ای داری؛ رویش بزن و بازسازی کن";else if(S.wins===0)t="آماده‌ای؟ از تب «نبرد» اولین مرحله را شروع کن ⚔️";
  if(sel)t="";h.textContent=t;h.style.opacity=t?1:0;
}

function gridFrom(x,y){
  const r=cv.getBoundingClientRect(),wx=(x-r.left-ox)/sc,wy=(y-r.top-oy)/sc;
  return[(wx/(TW/2)+wy/(TH/2))/2,(wy/(TH/2)-wx/(TW/2))/2];
}
const ptrs=new Map();let drag=null,pinch=null,moved=false;
cv.addEventListener("pointerdown",e=>{cv.setPointerCapture&&cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,px:panX,py:panY};moved=false}
  if(ptrs.size===2){const a=[...ptrs.values()];pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)||1,z:zoom};moved=true}});
cv.addEventListener("pointermove",e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(mode!=="city")return;
  if(ptrs.size===2&&pinch){const a=[...ptrs.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);zoom=clamp(pinch.z*d/pinch.d,.8,2.8);applyCam()}
  else if(ptrs.size===1&&drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(moved||Math.hypot(dx,dy)>10){moved=true;const lim=Math.max(VW,VH)*.7*zoom;panX=clamp(drag.px+dx,-lim,lim);panY=clamp(drag.py+dy,-lim,lim);applyCam()}}
});
const upH=e=>{
  const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!had)return;
  if(ptrs.size===0&&drag&&!moved&&e.type==="pointerup"){
    const g=gridFrom(e.clientX,e.clientY);
    if(mode==="battle"){if(B&&!B.over)deploy(g[0],g[1])}else if(page==="city")cityTap(g[0],g[1]);
  }
  if(ptrs.size===0){drag=null;pinch=null}
};
cv.addEventListener("pointerup",upH);cv.addEventListener("pointercancel",upH);
cv.addEventListener("wheel",e=>{if(mode!=="city")return;e.preventDefault();zoom=clamp(zoom*(e.deltaY<0?1.1:.91),.8,2.8);applyCam()},{passive:false});
document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{sfx.tap();setPage(b.dataset.p)});
$("gift").onclick=claimGift;$("all").onclick=collectAll;$("land").onclick=()=>{sfx.tap();landSheet()};
$("bx").onclick=()=>{if(!B||B.over)return;if(B.exit&&performance.now()-B.exit<2500){endBattle(false);return}B.exit=performance.now();toast("برای خروج دوباره بزن (به‌منزله‌ی باخت)")};
$("spd").onclick=()=>{if(!B)return;B.speed=B.speed===1?2:1;$("spd").textContent=B.speed===1?"×۱":"×۲";sfx.tap()};
$("go").onclick=()=>{initAudio();if(AC&&AC.state==="suspended")AC.resume();$("title").classList.remove("on");sfx.horn();sfx.up()};
document.addEventListener("visibilitychange",()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
addEventListener("resize",resize);
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ================= حلقه ================= */
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  try{update(dt);draw()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
resize();updTop();
window.__dezh={S,get B(){return B},startBattle,setPage,deploy,expandLand,get GN(){return GN},musStep,M};
requestAnimationFrame(loop);
})();
