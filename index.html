  h+='<div class="card"><h3>🎁 هدیه‌ی روزانه</h3><p>هر ۲۰ ساعت یک هدیه‌ی رایگان.</p><button class="btn" id="gf2">دریافت هدیه</button></div>';
  e.innerHTML=h;e.querySelectorAll("[data-pk]").forEach(b=>b.onclick=()=>buyPack(b.dataset.pk));$("gf2").onclick=claimGift;
}
/* نقطه‌ی اتصال خرید واقعی: بعداً اینجا به درگاه پرداخت وصل می‌شود */
function buyPack(id){sfx.tap();toast("خرید درون‌برنامه‌ای به‌زودی فعال می‌شود 💎")}
function claimGift(){
  const left=20*3600*1000-(Date.now()-S.daily);
  if(left>0){const m=Math.ceil(left/60000);toast("هدیه‌ی بعدی تا "+fa(Math.floor(m/60))+" ساعت و "+fa(m%60)+" دقیقه‌ی دیگر");sfx.tap();return}
  const r=150+50*S.stage;S.daily=Date.now();S.coins+=r;save();sfx.win();
  for(let i=0;i<14;i++)fcoins.push({x:VW/2,y:VH/2,sx:VW/2,sy:VH/2,t:-i*.04,v:r/14,rx:rnd(-80,80),ry:rnd(-120,-20)});
  toast("هدیه: "+fn(r)+" 🪙");
}

  '<div class="card"><h3>🛡️ پهلوانان</h3><ul class="gd"><li>با سکه پهلوانان تازه را آزاد و ارتقا بده.</li><li>آرش دوربرد است، رستم سپر سنگین، گردآفرید سریع و کشنده.</li></ul></div>'+

  '<div class="card"><h3>💎 فروشگاه</h3><p>بسته‌های سکه به‌زودی. هدیه‌ی روزانه را هر روز بگیر.</p></div>';

function openX(u){for(const f of [()=>W0.openTelegramLink(u),()=>W0.openLink(u),()=>{if(!window.open(u,"_blank"))throw 0},()=>{location.href=u}]){try{f();return}catch(e){}}}
document.addEventListener("click",e=>{const a=e.target.closest("a[data-x]");if(a){e.preventDefault();openX(a.href)}});

/* ================= ورودی ================= */
function gridFrom(ev){
  const r=cv.getBoundingClientRect(),wx=(ev.clientX-r.left-ox)/sc,wy=(ev.clientY-r.top-oy)/sc;
  return[(wx/(TW/2)+wy/(TH/2))/2,(wy/(TH/2)-wx/(TW/2))/2];
}
let down=null;
cv.addEventListener("pointerdown",e=>{down={x:e.clientX,y:e.clientY}});
cv.addEventListener("pointerup",e=>{
  if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y);down=null;if(m>12)return;
  const g=gridFrom(e);
  if(mode==="battle"){if(B&&!B.over)deploy(g[0],g[1]);return}
  if(page!=="city")return;cityTap(g[0],g[1]);
});
document.querySelectorAll(".nb").forEach(b=>b.onclick=()=>{sfx.tap();setPage(b.dataset.p)});
$("snd").onclick=()=>{S.snd=S.snd?0:1;setSnd();sfx.tap()};
$("gift").onclick=claimGift;$("all").onclick=()=>{collectAll()};
$("bx").onclick=()=>{if(!B||B.over)return;if(B.exit&&performance.now()-B.exit<2500){endBattle(false);return}B.exit=performance.now();toast("برای خروج دوباره بزن (به‌منزله‌ی باخت)")};
$("spd").onclick=()=>{if(!B)return;B.speed=B.speed===1?2:1;$("spd").textContent=B.speed===1?"×۱":"×۲";sfx.tap()};
$("go").onclick=()=>{initAudio();if(AC&&AC.state==="suspended")AC.resume();$("title").classList.remove("on");sfx.horn();sfx.up()};
document.addEventListener("visibilitychange",()=>{if(!AC)return;document.hidden?AC.suspend():AC.resume()});
addEventListener("resize",resize);
document.addEventListener("contextmenu",e=>e.preventDefault());

/* ================= حلقه ================= */
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;T+=dt;
  try{update(dt);draw()}catch(e){console.error(e)}
  requestAnimationFrame(loop);
}
resize();setSnd();updTop();
window.__dezh={S,get B(){return B},startBattle,setPage,deploy};
requestAnimationFrame(loop);
})();
